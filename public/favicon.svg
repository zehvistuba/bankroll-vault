<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Fundo com bordas arredondadas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Barra esquerda (baixa) -->
  <rect x="80" y="336" width="80" height="96" rx="18" fill="white" fill-opacity="0.45"/>

  <!-- Barra central (média) -->
  <rect x="216" y="240" width="80" height="192" rx="18" fill="white" fill-opacity="0.70"/>

  <!-- Barra direita (alta) -->
  <rect x="352" y="144" width="80" height="288" rx="18" fill="white" fill-opacity="0.95"/>

  <!-- Linha de tendência suave -->
  <path d="M120 336 C180 280 260 210 392 144" stroke="white" stroke-width="14" stroke-opacity="0.30" fill="none" stroke-linecap="round"/>

  <!-- Ponto esmeralda no pico -->
  <circle cx="392" cy="144" r="40" fill="#10B981"/>
  <circle cx="392" cy="144" r="20" fill="white"/>
</svg>